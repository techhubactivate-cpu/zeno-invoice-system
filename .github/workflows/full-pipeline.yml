name: Test

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: List files
        run: ls -la
      - name: Check PHP
        run: php -v
      - name: Done
        run: echo "✅ Workflow completed!"
