name: Full Pipeline

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      # 1. Get your code
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Show what's in your repo
      - name: List files
        run: ls -la

      # 3. Check PHP syntax
      - name: Check PHP
        run: php -l *.php || true

      # 4. Build Docker image
      - name: Build Docker image
        run: |
          docker build -t zeno-app .

      # 5. Show Docker images
      - name: Show Docker images
        run: docker images

      # 6. Done
      - name: Done
        run: echo "✅ Build complete! Image: zeno-app"
